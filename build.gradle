plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 1.21.1 runs on Java 21, so we compile for Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    // Create, Ponder and Flywheel live here
    maven { url = 'https://maven.createmod.net' }
    // Registrate (Create's registration library)
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    // JEI, so you can look up our recipes in-game while testing
    maven { url = 'https://maven.blamejared.com' }
}

neoForge {
    version = project.neo_version

    // Parchment gives Minecraft's code readable parameter names and javadoc
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // Boots a headless world, runs every @GameTest, then exits (non-zero if any failed)
        gameTestServer {
            type = 'gameTestServer'
        }
        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Create itself. transitive = false means "just Create's jar": its published dependency list
    // also names a pile of Create's own dev-only mods, so we list the real requirements ourselves.
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}") {
        transitive = false
    }
    implementation "com.tterrag.registrate:Registrate:${registrate_version}"
    implementation "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"

    // Flywheel is Create's rendering engine: the API to compile against, the full mod to run with.
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"

    // JEI only in our dev client, not a real dependency of the mod
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:19.21.0.247"

    // JUnit for plain unit tests (src/test), e.g. the quality math
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Fills in the ${...} placeholders inside src/main/templates (the mod's metadata file).
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            create_version_range   : create_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
